name: Reassemble Activities dependency lockfile

on:
  push:
    branches:
      - feat/class-workspace-activities-beta-20261127

permissions:
  contents: write

jobs:
  restore-lockfile:
    if: startsWith(github.event.head_commit.message, 'Add recovered Activities beta source')
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Reassemble and verify the original lockfile
        shell: bash
        run: |
          set -euo pipefail
          cat recovery-lock-parts/*.gzpart > /tmp/package-lock.json.gz
          gzip -t /tmp/package-lock.json.gz
          gzip -dc /tmp/package-lock.json.gz > package-lock.json
          test "$(wc -c < package-lock.json)" -eq 323782
          node -e "const p=require('./package-lock.json'); if(p.name !== 'fcu-student-portal' || p.version !== '0.14.0-beta.3') process.exit(1)"
          rm -rf recovery-lock-parts
          rm -f .github/workflows/rebuild-activities-lockfile.yml

      - name: Commit restored lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json recovery-lock-parts .github/workflows/rebuild-activities-lockfile.yml
          git commit -m "Restore exact Activities dependency lockfile"
          git push

name: Google Chat integration validation

on:
  push:
    branches:
      - feature/google-chat-integration
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saga_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saga_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/saga_ci
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/saga_ci
      AUTH_SECRET: ci-only-secret-value-with-at-least-32-characters
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate npm lockfile for dependency changes
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile to the pull request branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/package-lock.json?ref=$PR_BRANCH" --jq .sha)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/package-lock.json" \
            -f message="chore: update npm lockfile for Cloudflare R2" \
            -f content="$(base64 -w0 package-lock.json)" \
            -f sha="$current_sha" \
            -f branch="$PR_BRANCH"
      - name: Install dependencies and generate Prisma client
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Build the existing main-branch schema baseline
        run: |
          git show origin/main:prisma/schema.prisma > prisma/schema.base.prisma
          npx prisma db push --schema=prisma/schema.base.prisma
      - name: Verify the Class Chats hub migration is present in the main schema
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          try {
            await client.connect();
            const result = await client.query(
              "SELECT 1 FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'GoogleChatSpace' AND column_name = 'spaceUri'"
            );
            if (result.rowCount !== 1) throw new Error("GoogleChatSpace.spaceUri is missing from the current main schema.");
            console.log("GoogleChatSpace.spaceUri exists in the current main schema.");
          } finally {
            await client.end();
          }
          NODE
      - name: Run TypeScript checks
        run: npx tsc --noEmit
      - name: Run full application build and test suite
        run: npm run build
